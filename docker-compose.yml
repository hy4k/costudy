version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - GEMINI_API_KEY=${GEMINI_API_KEY}
    container_name: costudy_app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
