name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

  responsive:
    # Drives a real browser, so it is kept off the push path: run it from the
    # Actions tab before a release, or locally with `npm run audit:responsive`.
    name: Responsive audit (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit public entry surfaces
        run: npm run audit:responsive

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit
          path: audit/responsive
          retention-days: 14
