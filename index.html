<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoStudy | Strategic CMA US Mastery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            colors: {
              brand: {
                DEFAULT: '#ff1a1a',
                50: '#fff1f1',
                100: '#ffdfdf',
                200: '#ffc5c5',
                300: '#ff9d9d',
                400: '#ff6464',
                500: '#ff1a1a',
                600: '#ed0000',
                700: '#c80000',
                800: '#a50404',
                900: '#890b0b',
              },
              cma: {
                navy: '#0f172a',
                gold: '#f59e0b',
                emerald: '#10b981',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-brand-50: #fff1f1;
        --color-brand-100: #ffdfdf;
        --color-brand-200: #ffc5c5;
        --color-brand-300: #ff9d9d;
        --color-brand-400: #ff6464;
        --color-brand-500: #ff1a1a;
        --color-brand-600: #ed0000;
        --color-brand-700: #c80000;
        --color-brand-800: #a50404;
        --color-brand-900: #890b0b;
      }

      body {
        background-color: #f8fafc;
        color: #0f172a;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-brand-500); }

      .container-button {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        grid-template-areas: "bt-1 bt-2 bt-3" "bt-4 bt-5 bt-6";
        position: relative;
        perspective: 800px;
        padding: 0;
        width: 140px;
        height: 44px;
        transition: all 0.3s ease-in-out;
      }
      .container-button:active { transform: scale(0.95); }
      .hover-area { position: absolute; width: 100%; height: 100%; z-index: 20; }
      .bt-1 { grid-area: bt-1; }
      .bt-2 { grid-area: bt-2; }
      .bt-3 { grid-area: bt-3; }
      .bt-4 { grid-area: bt-4; }
      .bt-5 { grid-area: bt-5; }
      .bt-6 { grid-area: bt-6; }

      .bt-1:hover ~ .tilt-btn { transform: rotateX(15deg) rotateY(-15deg); box-shadow: -2px -2px #ff1a1a22; }
      .bt-3:hover ~ .tilt-btn { transform: rotateX(15deg) rotateY(15deg); box-shadow: 2px -2px #ff1a1a22; }
      .bt-4:hover ~ .tilt-btn { transform: rotateX(-15deg) rotateY(-15deg); box-shadow: -2px 2px #ff1a1a22; }
      .bt-6:hover ~ .tilt-btn { transform: rotateX(-15deg) rotateY(15deg); box-shadow: 2px 2px #ff1a1a22; }

      .tilt-btn {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 12px;
        transition: all 0.3s ease-out;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 600;
        color: #64748b;
        z-index: 1;
        pointer-events: none;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      }
      .tilt-btn.active {
        background: var(--color-brand-500);
        backdrop-filter: blur(16px);
        border-color: rgba(255, 255, 255, 0.3);
        color: #ffffff;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
      }
      .hover-area:hover ~ .tilt-btn {
        color: #0f172a;
        background: rgba(255, 255, 255, 0.7);
        border-color: var(--color-brand-500);
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* ==========================================
         DARK MODE CUSTOM OVERRIDES
         ========================================== */
      html.dark, body.dark {
        background-color: #0b0f19;
        color: #f8fafc;
      }
      .dark ::-webkit-scrollbar-track { background: #0f172a; }
      .dark ::-webkit-scrollbar-thumb { background: #334155; }
      
      .dark .bg-white {
        background-color: #0f172a !important;
        color: #f8fafc !important;
      }
      .dark .bg-slate-50 {
        background-color: #0b0f19 !important;
      }
      .dark .bg-slate-100 {
        background-color: #1e293b !important;
      }
      .dark .bg-slate-100\/50 {
        background-color: rgba(30, 41, 59, 0.5) !important;
      }
      .dark .text-slate-900, 
      .dark .text-slate-800, 
      .dark .text-slate-700 {
        color: #f8fafc !important;
      }
      .dark .text-slate-600, 
      .dark .text-slate-500 {
        color: #94a3b8 !important;
      }
      .dark .text-slate-400 {
        color: #64748b !important;
      }
      .dark .border-slate-100,
      .dark .border-slate-200,
      .dark .border-slate-300,
      .dark .border-slate-50 {
        border-color: #1e293b !important;
      }
      .dark .bg-white\/80 {
        background-color: rgba(15, 23, 42, 0.8) !important;
      }
      .dark .bg-white\/95 {
        background-color: rgba(15, 23, 42, 0.95) !important;
      }
      .dark .bg-white\/40 {
        background-color: rgba(15, 23, 42, 0.4) !important;
      }
      .dark .bg-white\/20 {
        background-color: rgba(15, 23, 42, 0.2) !important;
      }
      .dark .bg-white\/10 {
        background-color: rgba(255, 255, 255, 0.05) !important;
      }
      .dark .bg-slate-50\/50 {
        background-color: rgba(11, 15, 25, 0.5) !important;
      }
      .dark .bg-gradient-to-b.from-slate-50\/50.to-white {
        background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.5), #0f172a) !important;
      }

      /* Form Elements */
      .dark input, 
      .dark textarea, 
      .dark select {
        background-color: #1e293b !important;
        color: #f8fafc !important;
        border-color: #334155 !important;
      }
      .dark input::placeholder, 
      .dark textarea::placeholder {
        color: #64748b !important;
      }

      /* Tilt Buttons in Dark Mode */
      .dark .tilt-btn {
        background: rgba(15, 23, 42, 0.4);
        border-color: rgba(255, 255, 255, 0.1);
        color: #94a3b8;
      }
      .dark .tilt-btn.active {
        background: var(--color-brand-500);
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.2);
      }
      .dark .hover-area:hover ~ .tilt-btn {
        color: #f8fafc;
        background: rgba(15, 23, 42, 0.7);
        border-color: var(--color-brand-500);
      }

      /* Cards & Shadows */
      .dark .shadow-sm, 
      .dark .shadow-md, 
      .dark .shadow-lg, 
      .dark .shadow-xl, 
      .dark .shadow-2xl {
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.3) !important;
      }

      /* Mastery System Badges & Cards */
      .dark .bg-emerald-100 {
        background-color: rgba(16, 185, 129, 0.2) !important;
        color: #34d399 !important;
        border-color: rgba(16, 185, 129, 0.3) !important;
      }
      .dark .bg-emerald-50 {
        background-color: rgba(16, 185, 129, 0.1) !important;
        color: #34d399 !important;
      }
      .dark .bg-blue-100 {
        background-color: rgba(59, 130, 246, 0.2) !important;
        color: #60a5fa !important;
        border-color: rgba(59, 130, 246, 0.3) !important;
      }
      .dark .bg-amber-100 {
        background-color: rgba(245, 158, 11, 0.2) !important;
        color: #fbbf24 !important;
        border-color: rgba(245, 158, 11, 0.3) !important;
      }
      .dark .bg-rose-100 {
        background-color: rgba(244, 63, 94, 0.2) !important;
        color: #f43f5e !important;
        border-color: rgba(244, 63, 94, 0.3) !important;
      }
      .dark .bg-rose-50 {
        background-color: rgba(239, 68, 68, 0.1) !important;
        color: #f87171 !important;
      }
      .dark .bg-brand-50 {
        background-color: rgba(220, 38, 38, 0.2) !important;
        color: #f87171 !important;
        border-color: rgba(220, 38, 38, 0.3) !important;
      }
      .dark .bg-slate-200 {
        background-color: #334155 !important;
      }
    </style>
  </head>
  <body class="selection:bg-brand selection:text-white antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
